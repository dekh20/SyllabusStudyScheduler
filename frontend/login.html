<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Syllab.Us - Login</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<nav>
		<h2>Syllab.Us</h2>
	</nav>
	<div class="container">
		<h1>Less deadline stress. More progress.</h1>
		<p>Create an account, track assignments, and stay on top of deadlines.</p>
	<div class="forms">
		<div class="card">
                	<h2>Welcome back</h2>
                	<p>Enter your email and password.</p>
                <form method="POST" action="/login">
                    	<label for="login-email">School Email</label>
                    	<input type="email" id="login-email" name="email" required>
                	<label for="login-password">Password</label>
                    	<input type="password" id="login-password" name="password" required>
			<button type="submit">Sign In</button>
		</form>
	</div>
		<div class="card">
			<h2>New to Syllab.Us?</h2>
                	<p>Create your student account.</p>

                <form action ="assessment.html">
                    <label for="register-name">Full Name</label>
                    <input type="text" id="register-name"
                           name="name" required>

                    <label for="register-email">Email Address</label>
                    <input type="email" id="register-email"
                           name="email" required>

                    <label for="register-password">Password</label>
                    <input type="password" id="register-password"
                           name="password" minlength="8" required>

                    <button type="submit">Create Account</button>
                </form>
            </div>

        </div>
    </div>
</body>
</html>
