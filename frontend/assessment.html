<!DOCTYPE html>
<html>
<head>
	<title>Study Assessment</title>
    	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>Syllab.Us</h1>
    	<h2>Study Assessment</h2>
    	<p>Tell us about your study habits!</p>

	<form action="dashboard.html">

    		<h3>1. When do you study best?</h3>
    		<label><input type="radio" name="time"> Morning</label>
    		<label><input type="radio" name="time"> Afternoon</label>
    		<label><input type="radio" name="time"> Night</label>

    		<h3>2. How long do you study?</h3>
    		<label><input type="radio" name="duration"> 30 minutes</label>
    		<label><input type="radio" name="duration"> 1 hour</label>
    		<label><input type="radio" name="duration"> 2 hours</label>

    		<h3>3. How do you prefer studying?</h3>
    		<label><input type="radio" name="method"> Alone</label>
 		<label><input type="radio" name="method"> In a group</label>
    		<button type="submit">Continue</button>
	</form>
</body>
</html>
